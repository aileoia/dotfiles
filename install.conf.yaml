---
- defaults:
    link:
      relink: true
      create: true
- clean: ["~"]
- create:
    - ~/.local/bin
- shell:
    - command: git submodule update --init --recursive
      description: Installing submodules
- link:
    # yamllint disable rule:line-length
    ~/.antigen: submodules/antigen
    ~/.config/feh/themes: config/feh/themes
    ~/.config/i3/config: config/i3.config
    ~/.config/i3blocks.conf: config/i3blocks.conf
    ~/.config/kitty/kitty.conf: config/kitty/kitty.conf
    ~/.config/nvim/:
      path: config/nvim/*
      glob: true
    ~/.config/ranger/rc.conf: config/ranger/rc.conf
    ~/.config/regolith3/i3/config.d/20_screen-lock: config/regolith3/i3/config.d/20_screen-lock
    ~/.config/regolith3/i3/config.d/90_app-workspaces: config/regolith3/i3/config.d/90_app-workspaces
    ~/.config/regolith3/Xresources: config/regolith3/Xresources
    ~/.gitignore:
    ~/.local/share/nvim/site/autoload/plug.vim: submodules/vim-plug/plug.vim
    # `zg` appends here; neovim resolves this path on its own, so no `spellfile`
    # setting is needed. The compiled `.spl` stays next to it, outside the repo.
    ~/.local/share/nvim/site/spell/en.utf-8.add: config/nvim/spell/en.utf-8.add
    ~/.p10k.zsh:
    ~/.vim/autoload/plug.vim: submodules/vim-plug/plug.vim
    ~/.vimrc:
    ~/.zshrc:
- shell:
    - command: |
        if ! cat ~/.bashrc | grep "exec zsh"
        then
          echo "which zsh > /dev/null  && exec zsh" >> ~/.bashrc
        fi
      description: Append 'exec zsh' to bashrc
    - command: vim +PlugInstall +qall
      description: Install vim plugins
